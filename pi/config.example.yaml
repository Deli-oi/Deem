# Deem central controller configuration.
# Copy to config.yaml and edit. Values like ${DEEM_SINK_TOKEN} are expanded
# from environment variables at load time (keep secrets out of this file).

log_level: INFO

mqtt:
  host: localhost          # Mosquitto runs on the Pi itself
  port: 1883
  username: null           # set if you enable auth on the broker
  password: null
  base_topic: deem         # all topics live under this prefix
  client_id: deem-controller
  keepalive: 60

buffer:
  # Readings are persisted here so nothing is lost if the web endpoint is
  # down or the process restarts.
  db_path: ./deem_buffer.sqlite3
  max_rows: 100000         # oldest rows are dropped past this cap

sink:
  # Where normalized readings get relayed. The controller is wired to POST
  # batches to the greenhouse web endpoint; the exact URL/token is still being
  # finalized with the webapp team, so it comes from the environment (${...})
  # and gets filled in later without touching this file.
  # (type: log is still available for local development — it just prints batches.)
  type: http               # log | http
  url: ${DEEM_SINK_URL}    # set once the webapp team provides the ingest endpoint
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer ${DEEM_SINK_TOKEN}   # token from the webapp team
  batch_size: 50
  flush_interval_s: 5       # how often the relay worker drains the buffer
  timeout_s: 10
  max_retries: 8            # per-record; after this it moves to the dead table
  backoff_base_s: 2.0       # exponential backoff between retries
