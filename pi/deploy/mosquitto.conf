# Example Mosquitto config for the Deem Pi.
# Install the broker on the Pi first:
#   sudo apt update && sudo apt install -y mosquitto mosquitto-clients
# Then drop this in as /etc/mosquitto/conf.d/deem.conf and restart:
#   sudo systemctl restart mosquitto

listener 1883 0.0.0.0

# WebSocket listener so the browser UI (demo/) can subscribe to telemetry and
# send set_relay commands. Set VITE_MQTT_URL=ws://<pi-ip>:9001 in demo/.env.local.
listener 9001 0.0.0.0
protocol websockets

# NOTE: Debian's stock /etc/mosquitto/mosquitto.conf already sets `persistence`
# and `persistence_location`. Re-declaring them here produces a
# "Duplicate persistence value" error and the broker refuses to start, so we
# intentionally do NOT set them in this drop-in.

# --- Development: allow unauthenticated LAN clients (easy to start with) ---
allow_anonymous true

# --- Production: turn off anonymous and require credentials -----------------
# allow_anonymous false
# password_file /etc/mosquitto/passwd
#   Create users with:
#     sudo mosquitto_passwd -c /etc/mosquitto/passwd deem-controller
#     sudo mosquitto_passwd    /etc/mosquitto/passwd esp32-aqi-01
