# Example Mosquitto config for the Deem Pi.
# Install the broker on the Pi first:
#   sudo apt update && sudo apt install -y mosquitto mosquitto-clients
# Then drop this in as /etc/mosquitto/conf.d/deem.conf and restart:
#   sudo systemctl restart mosquitto

listener 1883 0.0.0.0
persistence true
persistence_location /var/lib/mosquitto/

# --- Development: allow unauthenticated LAN clients (easy to start with) ---
allow_anonymous true

# --- Production: turn off anonymous and require credentials -----------------
# allow_anonymous false
# password_file /etc/mosquitto/passwd
#   Create users with:
#     sudo mosquitto_passwd -c /etc/mosquitto/passwd deem-controller
#     sudo mosquitto_passwd    /etc/mosquitto/passwd esp32-aqi-01
