# Bind X to the SPI TFT framebuffer so the kiosk renders on the panel with no
# desktop/HDMI. Install to /etc/X11/xorg.conf.d/99-fbdev-tft.conf
#
# AutoAddGPU off stops Xorg from grabbing the (headless) KMS GPU and lets the
# fbdev driver own the panel. If your display overlay creates a framebuffer
# other than /dev/fb0, change the "fbdev" option to match (see: ls /dev/fb*).
Section "ServerFlags"
    Option      "AutoAddGPU" "off"
EndSection

Section "Device"
    Identifier  "Deem TFT"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier  "Deem Screen"
    Device      "Deem TFT"
EndSection
