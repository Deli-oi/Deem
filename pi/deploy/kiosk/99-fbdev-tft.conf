# Bind X to the SPI TFT framebuffer so the kiosk renders on the panel with no
# desktop/HDMI. Install to /etc/X11/xorg.conf.d/99-fbdev-tft.conf
#
# If your display overlay creates a framebuffer other than /dev/fb1, change the
# "fbdev" option below to match (see: ls /dev/fb*).
Section "Device"
    Identifier  "Deem TFT"
    Driver      "fbdev"
    Option      "fbdev" "/dev/fb1"
EndSection

Section "Screen"
    Identifier  "Deem Screen"
    Device      "Deem TFT"
EndSection
