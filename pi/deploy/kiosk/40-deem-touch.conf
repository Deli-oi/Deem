# libinput calibration for the ADS7846 touchscreen. Install to
# /etc/X11/xorg.conf.d/40-deem-touch.conf
#
# The CalibrationMatrix below is PANEL-SPECIFIC (it corrects the Y-axis flip and
# scales the resistive range to the rotate=0 portrait display). Regenerate it for
# your panel with pi/deploy/kiosk/touch-calibrate.py, which tap-calibrates the
# four corners and rewrites this file.
Section "InputClass"
    Identifier  "Deem ADS7846 Touch"
    MatchProduct "ADS7846 Touchscreen"
    Driver "libinput"
    Option "CalibrationMatrix" "1.14342 -0.02131 -0.09705 0.00483 -1.14653 1.10310 0.00000 0.00000 1.00000"
EndSection
